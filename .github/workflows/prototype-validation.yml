name: Prototype Validation

on:
  pull_request:
    paths:
      - "06-prototype/**"
      - ".github/workflows/prototype-validation.yml"
  push:
    branches:
      - main
    paths:
      - "06-prototype/**"
      - ".github/workflows/prototype-validation.yml"

permissions:
  contents: read

jobs:
  validate-synthetic-passports:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bundled synthetic passports
        run: |
          python 06-prototype/src/validate_passports.py \
            06-prototype/synthetic_data/roll_quality_passports.jsonl

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s 06-prototype/tests \
            -p 'test_*.py' \
            -v
